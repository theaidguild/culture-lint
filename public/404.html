<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>culture-lint</title>
    <script>
      ;(function () {
        var redirectKey = 'culture-lint:spa-redirect'
        var path = window.location.pathname + window.location.search + window.location.hash
        var base = window.location.pathname.replace(/\/[^/]*$/, '/')
        var relativePath = path.startsWith(base) ? path.slice(base.length) : path.replace(/^\//, '')

        try {
          window.sessionStorage.setItem(redirectKey, relativePath)
        } catch (err) {
          // Ignore storage failures and still send users back to the app root.
        }

        window.location.replace('./')
      })()
    </script>
  </head>
  <body></body>
</html>
